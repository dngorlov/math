<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Тренажёр по матанализу: теория, практика по темам, бесконечный генератор задач, графики и серия дней.">
<title>!¡ матан</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="!¡ матан — тренажёр по матанализу">
<meta property="og:description" content="Таблица производных, пределы, окружность и бесконечный генератор задач.">
<meta property="og:image" content="icons/og.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip" href="#main">К содержимому</a>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <button class="streak-btn" id="streak-btn" aria-label="Открыть меню серии"></button>
      <div class="brand-txt"><span class="brand-name">!¡ матан</span><small id="streak-sub">Сегодня 0 / 5</small></div>
    </div>
    <div class="top-right">
    <nav class="nav-top" aria-label="Разделы">
      <a href="#/practice" data-nav="practice">Темы</a>
      <a href="#/endless" data-nav="endless">Генератор</a>
      <a href="#/theory" data-nav="theory">Теория</a>
      <a href="#/graphs" data-nav="graphs">Графики</a>
      <a href="#/rating" data-nav="rating">Рейтинг</a>
    </nav>
    <button class="acct-btn" id="acct-btn" aria-label="Войти и настройки"></button>
    </div>
  </div>
</header>
<div id="warn"></div>
<div id="goal-banner" class="goal-wrap" hidden></div>

<main id="main">
  <section id="view-practice" class="wrap" aria-live="polite"></section>
  <section id="view-endless" class="wrap" hidden aria-live="polite"></section>
  <section id="view-theory" hidden></section>
  <section id="view-graphs" class="wrap" hidden></section>
  <section id="view-rating" class="wrap" hidden></section>
  <section id="view-duel" class="wrap" hidden></section>
  <section id="view-stats" class="wrap" hidden></section>
</main>

<nav class="nav-bottom" aria-label="Разделы">
  <a href="#/practice" data-nav="practice">Темы</a>
  <a href="#/endless" data-nav="endless">Генератор</a>
  <a href="#/theory" data-nav="theory">Теория</a>
  <a href="#/graphs" data-nav="graphs">Графики</a>
  <a href="#/rating" data-nav="rating">Рейтинг</a>
</nav>

<!-- Полноэкранные ключевые анимации серии -->
<div class="fx" id="fx" hidden role="dialog" aria-modal="true" aria-labelledby="fx-title">
  <div class="fx-mark" id="fx-mark"></div>
  <div class="fx-people" hidden></div>
  <h2 class="fx-title" id="fx-title"></h2>
  <p class="fx-text"></p>
  <div class="fx-actions"></div>
</div>

<!-- Меню серии -->
<div class="sheet-bd" id="sheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Серия">
    <div class="sheet-head"><h2>Серия</h2><button class="sheet-close" aria-label="Закрыть">✕</button></div>
    <div id="sheet-body"></div>
  </section>
</div>

<!-- Профиль и настройки -->
<div class="sheet-bd" id="acct" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Профиль">
    <div class="sheet-head"><h2>Профиль</h2><button class="sheet-close" aria-label="Закрыть">✕</button></div>
    <div id="acct-body"></div>
  </section>
</div>

<!-- Объявления -->
<div class="sheet-bd" id="news" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="news-title">
    <div class="sheet-head"><h2 id="news-title">Что нового</h2><button class="sheet-close" aria-label="Закрыть">✕</button></div>
    <div id="news-body"></div>
    <button class="btn primary big" data-news-close>Понятно</button>
  </section>
</div>

<!-- Сообщение об ошибке -->
<div class="sheet-bd" id="report" hidden>
  <section class="sheet small" role="dialog" aria-modal="true" aria-labelledby="rp-title">
    <div class="sheet-head"><h2 id="rp-title">Сообщить об ошибке</h2><button class="sheet-close rp-close" aria-label="Закрыть">✕</button></div>
    <p class="rp-q muted"></p>
    <label class="rp-label" for="rp-text">Что не так?</label>
    <textarea id="rp-text" rows="4" placeholder="Например: в варианте ответа потерян минус"></textarea>
    <div class="actions">
      <button class="btn primary rp-gh">Отправить на GitHub</button>
      <button class="btn ghost rp-copy">Скопировать текст</button>
    </div>
    <p class="muted small">На GitHub откроется готовое сообщение. Для отправки нужен аккаунт GitHub.</p>
  </section>
</div>

<div class="toast" id="toast" hidden role="status"></div>
</body>
</html>
